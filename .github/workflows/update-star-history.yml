name: Update star history

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-star-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Scheduled runs only make sense in the canonical repo; forks can still
    # trigger manually via workflow_dispatch.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'kangarooking/cangjie-skill'
    steps:
      - uses: actions/checkout@v4

      - name: Generate star history chart
        env:
          # STAR_HISTORY_TOKEN is optional; the default workflow token can
          # read public stargazer timestamps just fine.
          GITHUB_TOKEN: ${{ secrets.STAR_HISTORY_TOKEN || github.token }}
        run: python3 scripts/generate_star_history.py

      - name: Commit updated chart
        run: |
          if git diff --quiet -- assets/star-history.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.svg
          git commit -m "docs: update star history chart"
          git push
